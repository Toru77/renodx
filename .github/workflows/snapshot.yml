name: snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  packages: write
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang (x64)
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure MSVC (amd64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64

      - name: Build Trails Beyond Horizon Vanilla Plus
        run: cmake --build --preset clang-x64-release --target kai-vanillaplus --verbose

      - name: Build Sword Art Online Alicization Lycoris
        run: cmake --build --preset clang-x64-release --target sao-alicization --verbose

      - name: Build Forza Horizon 6 Ray Reconstruction
        run: cmake --build --preset clang-x64-release --target forzahorizon6-rr --verbose

      - name: Prepare Release folder
        run: |
          md githubrelease
          copy build\release\*.addon64 githubrelease\
          copy build\release\*.pdb githubrelease\

      - name: Create a Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: snapshot
          title: RenoDX Snapshot Build (Toru77)
          files: githubrelease/*
